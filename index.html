<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>King Slayer Lite</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"King Slayer Lite","short_name":"KingSlayerLite","start_url":".","display":"standalone","background_color":"#0a0a0a","theme_color":"#0a0a0a","icons":[{"src":"https://api.iconify.design/lucide:spade.svg?color=%2300E599","sizes":"192x192","type":"image/svg+xml"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0a0a0a; margin: 0; padding: 0; color: white; font-family: system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useRef } = React;

    const ITERATIONS = 1500;
    const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
    const SUITS = [
      { id: 'h', symbol: '♥', color: 'text-red-500' },
      { id: 'd', symbol: '♦', color: 'text-blue-400' },
      { id: 'c', symbol: '♣', color: 'text-emerald-400' },
      { id: 's', symbol: '♠', color: 'text-gray-300' }
    ];

    function App() {
      const [hero, setHero] = useState([null, null]);
      const [board, setBoard] = useState([null, null, null, null, null]);
      const [opponents, setOpponents] = useState(1);

      const [pickingSlot, setPickingSlot] = useState(null);
      const [selectedRank, setSelectedRank] = useState('A');
      const [equity, setEquity] = useState({ win: 0, tie: 0, lose: 0 });
      const [isCalculating, setIsCalculating] = useState(false);
      
      const workerRef = useRef(null);

      const deadCards = useMemo(() => {
        return [...hero, ...board].filter(Boolean);
      }, [hero, board]);

      const handleReset = () => {
        setHero([null, null]);
        setBoard([null, null, null, null, null]);
        setEquity({ win: 0, tie: 0, lose: 0 });
      };

      useEffect(() => {
        const workerCode = `
          import pokersolver from 'https://esm.sh/pokersolver';
          const Hand = pokersolver.Hand;

          const ALL_CARDS = [];
          const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
          const suits = ['h', 'd', 'c', 's'];
          ranks.forEach(r => suits.forEach(s => ALL_CARDS.push(r + s)));

          self.onmessage = function(e) {
            const { hero, boardCards, opponents, iterations } = e.data;
            
            try {
                let wins = 0;
                let ties = 0;

                const knownCards = new Set([...hero, ...boardCards]);
                const deck = ALL_CARDS.filter(c => !knownCards.has(c));

                for (let i = 0; i < iterations; i++) {
                  let currentDeck = [...deck];
                  // Fast Fisher-Yates shuffle
                  for (let j = currentDeck.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    const temp = currentDeck[j];
                    currentDeck[j] = currentDeck[k];
                    currentDeck[k] = temp;
                  }

                  let deckIndex = 0;
                  const simBoard = [...boardCards];
                  while (simBoard.length < 5) {
                    simBoard.push(currentDeck[deckIndex++]);
                  }

                  const allHands = [];
                  const heroEval = Hand.solve([...hero, ...simBoard]);
                  heroEval.isHero = true; 
                  allHands.push(heroEval);

                  // Deal random cards to N opponents
                  for (let o = 0; o < opponents; o++) {
                     const oppCards = [currentDeck[deckIndex++], currentDeck[deckIndex++]];
                     allHands.push(Hand.solve([...oppCards, ...simBoard]));
                  }
                  
                  const winners = Hand.winners(allHands);
                  
                  const heroWon = winners.some(w => w.isHero);
                  if (heroWon) {
                     if (winners.length === 1) wins++;
                     else ties++;
                  }
                }

                self.postMessage({ win: (wins / iterations) * 100, tie: (ties / iterations) * 100 });
            } catch (err) {
                self.postMessage({ error: err.message });
            }
          };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        workerRef.current = new Worker(URL.createObjectURL(blob), { type: 'module' });
        
        workerRef.current.onmessage = (e) => {
          if (e.data.error) {
            console.error("Worker Error:", e.data.error);
            setEquity({ win: 0, tie: 0, lose: 0 });
          } else {
            const { win, tie } = e.data;
            setEquity({ win, tie, lose: 100 - win - tie });
          }
          setIsCalculating(false);
        };

        return () => workerRef.current.terminate();
      }, []);

      useEffect(() => {
        const filledHero = hero.filter(Boolean);
        const filledBoard = board.filter(Boolean);

        if (filledHero.length === 2) {
          setIsCalculating(true);
          workerRef.current.postMessage({ hero: filledHero, boardCards: filledBoard, opponents, iterations: ITERATIONS });
        } else {
          setEquity({ win: 0, tie: 0, lose: 0 });
        }
      }, [hero, board, opponents]);

      const handleAssignCard = (card) => {
        if (!pickingSlot) return;
        const { type, index } = pickingSlot;
        
        if (type === 'hero') { 
          const next = [...hero]; 
          next[index] = card; 
          setHero(next); 
          
          if (index === 0) {
            setPickingSlot({ type: 'hero', index: 1 });
          } else {
            setPickingSlot(null);
          }
        } else if (type === 'board') { 
          const next = [...board]; 
          next[index] = card; 
          setBoard(next); 
          
          if (index === 0) {
            setPickingSlot({ type: 'board', index: 1 });
          } else if (index === 1) {
            setPickingSlot({ type: 'board', index: 2 });
          } else {
            setPickingSlot(null);
          }
        }
      };

      const handleClearCard = (type, index) => {
        if (type === 'hero') { 
          const next = [...hero]; next[index] = null; setHero(next); 
        } else if (type === 'board') { 
          const next = [...board]; next[index] = null; setBoard(next); 
        }
      };

      const renderCardBadge = (card, onClick, onClear) => {
        if (!card) {
          return (
            <button onClick={onClick} className="w-[38px] h-12 rounded-lg border border-dashed border-white/20 bg-white/5 flex items-center justify-center text-xs text-white/40 active:scale-95 transition-transform">
              +
            </button>
          );
        }
        const rank = card.slice(0, -1);
        const suit = SUITS.find(s => s.id === card.slice(-1));
        return (
          <div className="relative group">
            <button onClick={onClick} className="w-[38px] h-12 rounded-lg bg-[#1a1a1a] border border-white/20 flex flex-col items-center justify-center font-bold text-[13px] shadow-md active:scale-95 transition-transform">
              <span className="leading-none">{rank}</span>
              <span className={`text-sm leading-none ${suit?.color}`}>{suit?.symbol}</span>
            </button>
            <button onClick={(e) => { e.stopPropagation(); onClear(); }} className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 rounded-full text-[9px] flex items-center justify-center font-bold">×</button>
          </div>
        );
      };

      return (
        <div className="w-full max-w-[410px] min-h-screen mx-auto bg-[#0a0a0a] text-white p-3 pb-20 overflow-x-hidden">
          
          <div className="flex justify-between items-center mb-4 mt-2">
            <div>
              <h1 className="text-lg font-black tracking-wider text-white flex items-center gap-1.5"><span className="text-[#00E599]">♠</span> KING SLAYER LITE</h1>
              <p className="text-[8px] text-[#00E599] tracking-[0.25em] font-bold">PURE MATH ENGINE (FINAL)</p>
            </div>
            <button onClick={handleReset} className="text-[9px] text-[#FF0055] border border-[#FF0055]/30 px-3 py-1 rounded uppercase tracking-widest font-bold active:bg-[#FF0055]/20 transition-colors">
              Reset All
            </button>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-3 rounded-xl mb-3 w-full">
            <span className="text-[9px] uppercase tracking-wider text-gray-400 font-bold mb-2 block">Hero Hand</span>
            <div className="flex gap-2 mb-4">
              {renderCardBadge(hero[0], () => setPickingSlot({ type: 'hero', index: 0 }), () => handleClearCard('hero', 0))}
              {renderCardBadge(hero[1], () => setPickingSlot({ type: 'hero', index: 1 }), () => handleClearCard('hero', 1))}
            </div>

            <span className="text-[9px] uppercase tracking-wider text-gray-400 font-bold mb-2 block">Board</span>
            <div className="flex gap-1 overflow-x-auto pb-1 scrollbar-hide">
              {board.map((c, i) => (
                <React.Fragment key={`board-${i}`}>
                  {renderCardBadge(c, () => setPickingSlot({ type: 'board', index: i }), () => handleClearCard('board', i))}
                  {i === 2 && <div className="h-12 w-[1px] bg-white/10 shrink-0 mx-1" />}
                </React.Fragment>
              ))}
            </div>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-4 rounded-xl mb-3">
            <div className="flex justify-between items-center mb-2">
              <span className="text-[9px] text-gray-400 uppercase tracking-widest font-bold">Random Opponents</span>
              <span className="text-[#00E599] text-xs font-black">{opponents}</span>
            </div>
            <div className="flex gap-1">
              {[1, 2, 3, 4, 5, 6, 7].map(num => (
                <button key={num} onClick={() => setOpponents(num)} className={`flex-1 h-8 rounded text-[11px] font-bold transition-colors ${opponents === num ? 'bg-[#00E599] text-black shadow-[0_0_10px_rgba(0,229,153,0.3)]' : 'bg-white/5 text-white active:bg-white/10'}`}>
                  {num}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-4 rounded-xl shadow-2xl relative overflow-hidden">
            {isCalculating && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-10 flex items-center justify-center">
                <span className="text-[#00E599] text-[10px] font-bold tracking-widest animate-pulse">SIMULATING {ITERATIONS} RUNOUTS...</span>
              </div>
            )}
            <div className="mb-3">
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-[#00E599] tracking-wider">HERO WIN</span>
                <span className="text-[#00E599]">{equity.win.toFixed(1)}%</span>
              </div>
              <div className="h-1.5 w-full bg-[#121212] rounded-full overflow-hidden">
                <div className="h-full bg-[#00E599] transition-all duration-300" style={{ width: `${equity.win}%` }} />
              </div>
            </div>
            <div className="mb-3">
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-[#00A3FF] tracking-wider">TIE</span>
                <span className="text-[#00A3FF]">{equity.tie.toFixed(1)}%</span>
              </div>
              <div className="h-1.5 w-full bg-[#121212] rounded-full overflow-hidden">
                <div className="h-full bg-[#00A3FF] transition-all duration-300" style={{ width: `${equity.tie}%` }} />
              </div>
            </div>
            <div>
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-[#FF0055] tracking-wider">LOSE</span>
                <span className="text-[#FF0055]">{equity.lose.toFixed(1)}%</span>
              </div>
              <div className="h-1.5 w-full bg-[#121212] rounded-full overflow-hidden">
                <div className="h-full bg-[#FF0055] transition-all duration-300" style={{ width: `${equity.lose}%` }} />
              </div>
            </div>
          </div>

          {pickingSlot && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end">
              <div className="bg-[#141414] border-t border-white/10 p-4 rounded-t-2xl w-full max-w-[410px] mx-auto pb-8">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs uppercase tracking-widest text-gray-300 font-bold">Select Card</span>
                  <button onClick={() => setPickingSlot(null)} className="text-xs text-gray-400 border border-white/10 px-3 py-1 rounded">Close</button>
                </div>
                <div className="grid grid-cols-7 gap-1.5 mb-3">
                  {RANKS.map(r => (
                    <button key={r} onClick={() => setSelectedRank(r)} className={`h-9 rounded font-bold text-xs ${selectedRank === r ? 'bg-[#00E599] text-black shadow-md' : 'bg-white/5 text-white'}`}>{r}</button>
                  ))}
                </div>
                <div className="grid grid-cols-4 gap-2">
                  {SUITS.map(s => {
                    const cardKey = selectedRank + s.id;
                    const isTaken = deadCards.includes(cardKey);
                    return (
                      <button key={s.id} disabled={isTaken} onClick={() => handleAssignCard(cardKey)} className={`h-11 rounded-lg border flex items-center justify-center gap-1.5 text-base font-bold transition-transform ${isTaken ? 'opacity-20 border-transparent bg-white/5 cursor-not-allowed' : 'border-white/10 bg-white/5 active:bg-white/10 active:scale-95'}`}>
                        <span>{selectedRank}</span><span className={s.color}>{s.symbol}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
