<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>King Slayer Ultra</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"King Slayer","short_name":"KingSlayer","start_url":".","display":"standalone","background_color":"#0a0a0a","theme_color":"#0a0a0a","icons":[{"src":"https://api.iconify.design/lucide:spade.svg?color=%2300E599","sizes":"192x192","type":"image/svg+xml"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "@agonyz/poker-odds-calculator": "https://esm.sh/@agonyz/poker-odds-calculator"
      }
    }
  </script>

  <style>
    body { background-color: #0a0a0a; margin: 0; padding: 0; color: white; font-family: system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
    const SUITS = [
      { id: 'h', symbol: '♥', color: 'text-red-500' },
      { id: 'd', symbol: '♦', color: 'text-blue-400' },
      { id: 'c', symbol: '♣', color: 'text-emerald-400' },
      { id: 's', symbol: '♠', color: 'text-gray-300' }
    ];

    function App() {
      const [hero, setHero] = useState([null, null]);
      const [flop, setFlop] = useState([null, null, null]);
      const [turn, setTurn] = useState(null);
      const [river, setRiver] = useState(null);
      const [opponents, setOpponents] = useState(1);

      const [preflopAction, setPreflopAction] = useState('call');
      const [flopAction, setFlopAction] = useState('check_call');
      const [turnAction, setTurnAction] = useState('check_call');
      const [riverAction, setRiverAction] = useState('check_call');

      const [pickingSlot, setPickingSlot] = useState(null);
      const [selectedRank, setSelectedRank] = useState('A');
      const [equity, setEquity] = useState({ win: 0, tie: 0, lose: 0, combos: 0 });
      const [isCalculating, setIsCalculating] = useState(false);
      
      const workerRef = useRef(null);

      const boardCards = useMemo(() => {
        const b = [...flop];
        if (turn) b.push(turn);
        if (river) b.push(river);
        return b.filter(Boolean);
      }, [flop, turn, river]);

      const deadCards = useMemo(() => [...hero.filter(Boolean), ...boardCards], [hero, boardCards]);

      const handleReset = () => {
        setHero([null, null]);
        setFlop([null, null, null]);
        setTurn(null);
        setRiver(null);
        setEquity({ win: 0, tie: 0, lose: 0, combos: 0 });
        setPreflopAction('call');
        setFlopAction('check_call');
        setTurnAction('check_call');
        setRiverAction('check_call');
        setOpponents(1);
      };

      // V11 HEURISTIC: Nut Flush Draw Rescue Protocol
      const getHandTier = useCallback((hand) => {
        const [r1, r2] = hand;
        const v1 = RANKS.indexOf(r1); 
        const v2 = RANKS.indexOf(r2);
        const isPair = r1 === r2;
        const isSuited = hand.includes('s');

        let isPlayablePreflop = false;
        if (isPair) isPlayablePreflop = true; 
        else if (isSuited && v1 <= 4) isPlayablePreflop = true; 
        else if (isSuited && Math.abs(v1 - v2) <= 3) isPlayablePreflop = true; 
        else if (!isSuited && v1 <= 2 && v2 <= 3) isPlayablePreflop = true; 
        else if (!isSuited && Math.abs(v1 - v2) === 1 && v1 <= 4) isPlayablePreflop = true; 
        
        if (!isPlayablePreflop) return 4; 
        if (boardCards.length < 3) return 3; 

        const bRanks = boardCards.map(c => c[0]);
        const bVals = bRanks.map(r => RANKS.indexOf(r));
        const hit1 = bRanks.includes(r1);
        const hit2 = bRanks.includes(r2);
        
        const isSet = isPair && hit1;
        const isTwoPair = hit1 && hit2 && !isPair;

        const highestBoardVal = Math.min(...bVals);
        const topBoardRank = RANKS[highestBoardVal];
        const isTopPair = r1 === topBoardRank || r2 === topBoardRank;
        
        const isOverpair = isPair && (v1 < highestBoardVal);
        
        const touchesBoard = bVals.some(bv => Math.abs(v1 - bv) <= 2) || bVals.some(bv => Math.abs(v2 - bv) <= 2);

        const bSuits = boardCards.map(c => c.slice(-1));
        const suitCounts = bSuits.reduce((acc, s) => { acc[s] = (acc[s] || 0) + 1; return acc; }, {});
        const isMonotone = Math.max(...Object.values(suitCounts)) >= 3;

        const uniqueBoardVals = [...new Set(bVals)].sort((a, b) => a - b);
        let boardMaxCons = 1;
        let bCur = 1;
        for (let i = 0; i < uniqueBoardVals.length - 1; i++) {
          if (uniqueBoardVals[i + 1] === uniqueBoardVals[i] + 1) bCur++;
          else bCur = 1;
          if (bCur > boardMaxCons) boardMaxCons = bCur;
        }
        if (uniqueBoardVals.includes(0)) {
          const lowAceBoard = [...new Set([...uniqueBoardVals, 13])].sort((a,b) => a - b);
          let lbCur = 1;
          for (let i = 0; i < lowAceBoard.length - 1; i++) {
            if (lowAceBoard[i + 1] === lowAceBoard[i] + 1) lbCur++;
            else lbCur = 1;
            if (lbCur > boardMaxCons) boardMaxCons = lbCur;
          }
        }

        const uniqueVals = [...new Set([...bVals, v1, v2])].sort((a, b) => a - b);
        let maxConsecutive = 1;
        let currentConsecutive = 1;
        for (let i = 0; i < uniqueVals.length - 1; i++) {
          if (uniqueVals[i + 1] === uniqueVals[i] + 1) currentConsecutive++;
          else currentConsecutive = 1;
          if (currentConsecutive > maxConsecutive) maxConsecutive = currentConsecutive;
        }
        
        if (uniqueVals.includes(0)) {
           const lowAceVals = [...new Set([...uniqueVals, 13])].sort((a,b) => a - b);
           let lowCons = 1;
           for (let i = 0; i < lowAceVals.length - 1; i++) {
             if (lowAceVals[i + 1] === lowAceVals[i] + 1) lowCons++;
             else lowCons = 1;
             if (lowCons > maxConsecutive) maxConsecutive = lowCons;
           }
        }
        
        const isMadeStraight = maxConsecutive >= 5;
        const isStraightDraw = maxConsecutive === 4 && maxConsecutive > boardMaxCons && boardCards.length < 5;

        let isRaised = false;
        if (boardCards.length >= 3 && flopAction === 'raise') isRaised = true;
        if (boardCards.length >= 4 && turnAction === 'raise') isRaised = true;
        if (boardCards.length === 5 && riverAction === 'raise') isRaised = true;

        let tier = 4;

        if (isRaised) {
          if (isMadeStraight) tier = 1;
          else if (isSet || isTwoPair || isOverpair) tier = 1;
          else if (isTopPair && (v1 <= 2 || v2 <= 2)) tier = 2; 
          else if (isStraightDraw) tier = 2;
          else if (isSuited && boardCards.length < 5) {
            if (isMonotone) {
                // V11 FIX: Rescue Nut & King-high flush draws! (v1 <= 1)
                if (v1 <= 1 || (v1 <= 4 && v2 <= 4)) tier = 2; 
            } else if (Math.abs(v1 - v2) <= 2 && v1 <= 5) {
                tier = 2;
            }
          }
        } else {
          if (isMadeStraight) tier = 1;
          else if (isSet || isTwoPair || isOverpair) tier = 1;
          else if (isTopPair) tier = 2;
          else if (hit1 || hit2) {
             if (v1 <= bVals[1] || v2 <= bVals[1]) tier = 3; 
          }
          else if (isPair) {
             if (v1 < Math.max(...bVals)) tier = 3; 
          }
          else if (isStraightDraw) tier = 3;
          else if (v1 <= 4 && v2 <= 5 && touchesBoard && boardCards.length < 5) tier = 3; 
          else if (isSuited && touchesBoard && boardCards.length < 5) {
            if (isMonotone) {
                if (v1 <= 1 || (v1 <= 4 && v2 <= 4)) tier = 3;
            } else {
                tier = 3;
            }
          }
        }

        if (opponents >= 3 && tier === 3) tier = 4;
        if (opponents >= 5 && tier === 2) tier = 3;

        return tier;
      }, [boardCards, flopAction, turnAction, riverAction, opponents]);

      useEffect(() => {
        const workerCode = `
          import { CardGroup, OddsCalculator } from 'https://esm.sh/@agonyz/poker-odds-calculator';

          self.onmessage = function(e) {
            const { hero, boardCards, survivingRange, deadCards } = e.data;
            let totalWin = 0, totalTie = 0, validCombos = 0;

            const expandHand = (handStr, usedCards) => {
              const suits = ['h', 's', 'c', 'd'];
              const combos = [];
              const [r1, r2] = handStr;
              if (handStr.length === 2) {
                for (let i = 0; i < 4; i++) {
                  for (let j = i + 1; j < 4; j++) {
                    const c1 = r1 + suits[i]; const c2 = r2 + suits[j];
                    if (!usedCards.includes(c1) && !usedCards.includes(c2)) combos.push([c1, c2]);
                  }
                }
              } else if (handStr.includes('s')) {
                for (let i = 0; i < 4; i++) {
                  const c1 = r1 + suits[i]; const c2 = r2 + suits[i];
                  if (!usedCards.includes(c1) && !usedCards.includes(c2)) combos.push([c1, c2]);
                }
              } else {
                for (let i = 0; i < 4; i++) {
                  for (let j = 0; j < 4; j++) {
                    if (i !== j) {
                      const c1 = r1 + suits[i]; const c2 = r2 + suits[j];
                      if (!usedCards.includes(c1) && !usedCards.includes(c2)) combos.push([c1, c2]);
                    }
                  }
                }
              }
              return combos;
            };

            survivingRange.forEach(handStr => {
              const combos = expandHand(handStr, deadCards);
              combos.forEach(combo => {
                try {
                  const p1 = CardGroup.fromString(hero.join(''));
                  const p2 = CardGroup.fromString(combo.join(''));
                  const b = CardGroup.fromString(boardCards.join(''));
                  const res = OddsCalculator.calculate([p1, p2], b);
                  totalWin += res.equities[0].getEquity();
                  totalTie += res.equities[0].getTiePercentage();
                  validCombos++;
                } catch(err) {}
              });
            });

            self.postMessage({ win: totalWin, tie: totalTie, combos: validCombos });
          };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        workerRef.current = new Worker(URL.createObjectURL(blob), { type: 'module' });
        
        workerRef.current.onmessage = (e) => {
          const { win, tie, combos } = e.data;
          if (combos === 0) {
            setEquity({ win: 0, tie: 0, lose: 0, combos: 0 });
          } else {
            const finalWin = win / combos;
            const finalTie = tie / combos;
            setEquity({ win: finalWin, tie: finalTie, lose: 100 - finalWin - finalTie, combos });
          }
          setIsCalculating(false);
        };

        return () => workerRef.current.terminate();
      }, []);

      useEffect(() => {
        if (hero.filter(Boolean).length < 2 || boardCards.length < 3) return;
        setIsCalculating(true);
        
        const survivingRange = RANKS.flatMap(r1 => RANKS.map(r2 => {
          const hand = r1 === r2 ? `${r1}${r2}` : RANKS.indexOf(r1) < RANKS.indexOf(r2) ? `${r1}${r2}s` : `${r2}${r1}o`;
          return getHandTier(hand) !== 4 ? hand : null;
        })).filter(Boolean);

        workerRef.current.postMessage({ hero, boardCards, survivingRange, deadCards });
      }, [hero, boardCards, preflopAction, flopAction, turnAction, riverAction, opponents, getHandTier, deadCards]);

      const handleAssignCard = (card) => {
        if (!pickingSlot) return;
        const { type, index } = pickingSlot;
        if (type === 'hero') { const next = [...hero]; next[index] = card; setHero(next); }
        else if (type === 'flop') { const next = [...flop]; next[index] = card; setFlop(next); }
        else if (type === 'turn') setTurn(card);
        else if (type === 'river') setRiver(card);
        setPickingSlot(null);
      };

      const handleClearCard = (type, index) => {
        if (type === 'hero') { const next = [...hero]; next[index] = null; setHero(next); }
        else if (type === 'flop') { const next = [...flop]; next[index] = null; setFlop(next); }
        else if (type === 'turn') setTurn(null);
        else if (type === 'river') setRiver(null);
      };

      const renderCardBadge = (card, onClick, onClear) => {
        if (!card) {
          return (
            <button onClick={onClick} className="w-[38px] h-12 rounded-lg border border-dashed border-white/20 bg-white/5 flex items-center justify-center text-xs text-white/40 active:scale-95 transition-transform">
              +
            </button>
          );
        }
        const rank = card.slice(0, -1);
        const suit = SUITS.find(s => s.id === card.slice(-1));
        return (
          <div className="relative group">
            <button onClick={onClick} className="w-[38px] h-12 rounded-lg bg-[#1a1a1a] border border-white/20 flex flex-col items-center justify-center font-bold text-[13px] shadow-md active:scale-95 transition-transform">
              <span className="leading-none">{rank}</span>
              <span className={`text-sm leading-none ${suit?.color}`}>{suit?.symbol}</span>
            </button>
            <button onClick={(e) => { e.stopPropagation(); onClear(); }} className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 rounded-full text-[9px] flex items-center justify-center font-bold">×</button>
          </div>
        );
      };

      const renderMatrixCell = (r1, r2, i, j) => {
        const isSuited = i < j;
        const hand = i === j ? `${r1}${r2}` : isSuited ? `${r1}${r2}s` : `${r2}${r1}o`;
        const tier = getHandTier(hand);

        let style = "bg-[#121212] text-white/20 opacity-30";
        if (tier === 1) style = "bg-white text-black font-bold shadow-[0_0_8px_#00E599]";
        if (tier === 2) style = "bg-[#00E599] text-black font-semibold";
        if (tier === 3) style = "bg-[#00A3FF]/80 text-white";

        return (
          <div key={hand} className={`w-[24px] h-[24px] flex items-center justify-center text-[7.5px] rounded-sm transition-all duration-300 ${style}`}>
            {hand}
          </div>
        );
      };

      return (
        <div className="w-full max-w-[410px] min-h-screen mx-auto bg-[#0a0a0a] text-white p-3 pb-20 overflow-x-hidden">
          
          <div className="flex justify-between items-center mb-4 mt-2">
            <div>
              <h1 className="text-lg font-black tracking-wider text-white flex items-center gap-1.5"><span className="text-[#00E599]">♠</span> KING SLAYER</h1>
              <p className="text-[8px] text-gray-500 tracking-[0.25em]">ODDS CALCULATOR ULTRA</p>
            </div>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-3 rounded-xl mb-3 w-full">
            <div className="flex justify-between items-center mb-2">
              <div className="flex gap-4">
                <span className="text-[9px] uppercase tracking-wider text-gray-400 font-bold">Hero</span>
                <span className="text-[9px] uppercase tracking-wider text-gray-400 font-bold">Board</span>
              </div>
              <button onClick={handleReset} className="text-[8px] text-[#FF0055] border border-[#FF0055]/30 px-2 py-0.5 rounded uppercase tracking-widest font-bold active:bg-[#FF0055]/20 transition-colors">
                Clear Hand
              </button>
            </div>
            <div className="flex items-center gap-2">
              <div className="flex gap-1">
                {renderCardBadge(hero[0], () => setPickingSlot({ type: 'hero', index: 0 }), () => handleClearCard('hero', 0))}
                {renderCardBadge(hero[1], () => setPickingSlot({ type: 'hero', index: 1 }), () => handleClearCard('hero', 1))}
              </div>
              <div className="h-8 w-[1px] bg-white/10 shrink-0" />
              <div className="flex gap-1 overflow-x-auto pb-1 scrollbar-hide">
                {renderCardBadge(flop[0], () => setPickingSlot({ type: 'flop', index: 0 }), () => handleClearCard('flop', 0))}
                {renderCardBadge(flop[1], () => setPickingSlot({ type: 'flop', index: 1 }), () => handleClearCard('flop', 1))}
                {renderCardBadge(flop[2], () => setPickingSlot({ type: 'flop', index: 2 }), () => handleClearCard('flop', 2))}
                {renderCardBadge(turn, () => setPickingSlot({ type: 'turn', index: 0 }), () => handleClearCard('turn', 0))}
                {renderCardBadge(river, () => setPickingSlot({ type: 'river', index: 0 }), () => handleClearCard('river', 0))}
              </div>
            </div>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-3 rounded-xl mb-3">
            <div className="flex justify-between items-center mb-3 bg-black/40 p-1.5 rounded-lg border border-white/5">
              <span className="text-[9px] text-gray-400 uppercase tracking-widest pl-1">Opponents</span>
              <div className="flex gap-1">
                {[1, 2, 3, 4, 5, 6, 7].map(num => (
                  <button key={num} onClick={() => setOpponents(num)} className={`w-6 h-6 rounded text-[10px] font-bold transition-colors ${opponents === num ? 'bg-[#00E599] text-black' : 'bg-white/5 text-white active:bg-white/10'}`}>
                    {num}
                  </button>
                ))}
              </div>
            </div>

            <span className="text-[9px] uppercase tracking-widest text-gray-400 font-bold block mb-1.5">Action Line</span>
            
            <div className="grid grid-cols-2 gap-2 text-xs">
              <div className="flex items-center justify-between bg-black/40 px-2 py-1 rounded-lg border border-white/5">
                <span className="text-[9px] text-gray-400">Preflop</span>
                <div className="flex gap-0.5">
                  <button onClick={() => setPreflopAction('call')} className={`px-2 py-1 rounded text-[9px] transition-colors ${preflopAction === 'call' ? 'bg-[#00A3FF] text-white font-bold' : 'text-gray-500'}`}>Call</button>
                  <button onClick={() => setPreflopAction('raise')} className={`px-2 py-1 rounded text-[9px] transition-colors ${preflopAction === 'raise' ? 'bg-[#00A3FF] text-white font-bold' : 'text-gray-500'}`}>Raise</button>
                </div>
              </div>
              <div className={`flex items-center justify-between px-2 py-1 rounded-lg border transition-all ${boardCards.length >= 3 ? 'bg-black/40 border-white/5 opacity-100' : 'bg-black/20 border-transparent opacity-40 pointer-events-none'}`}>
                <span className="text-[9px] text-gray-400">Flop</span>
                <div className="flex gap-0.5">
                  <button onClick={() => setFlopAction('check_call')} className={`px-2 py-1 rounded text-[9px] transition-colors ${flopAction === 'check_call' ? 'bg-[#00E599] text-black font-bold' : 'text-gray-500'}`}>Check</button>
                  <button onClick={() => setFlopAction('raise')} className={`px-2 py-1 rounded text-[9px] transition-colors ${flopAction === 'raise' ? 'bg-[#00E599] text-black font-bold' : 'text-gray-500'}`}>Raise</button>
                </div>
              </div>
              <div className={`flex items-center justify-between px-2 py-1 rounded-lg border transition-all ${boardCards.length >= 4 ? 'bg-black/40 border-white/5 opacity-100' : 'bg-black/20 border-transparent opacity-40 pointer-events-none'}`}>
                <span className="text-[9px] text-gray-400">Turn</span>
                <div className="flex gap-0.5">
                  <button onClick={() => setTurnAction('check_call')} className={`px-2 py-1 rounded text-[9px] transition-colors ${turnAction === 'check_call' ? 'bg-[#00E599] text-black font-bold' : 'text-gray-500'}`}>Check</button>
                  <button onClick={() => setTurnAction('raise')} className={`px-2 py-1 rounded text-[9px] transition-colors ${turnAction === 'raise' ? 'bg-[#00E599] text-black font-bold' : 'text-gray-500'}`}>Raise</button>
                </div>
              </div>
              <div className={`flex items-center justify-between px-2 py-1 rounded-lg border transition-all ${boardCards.length === 5 ? 'bg-black/40 border-white/5 opacity-100' : 'bg-black/20 border-transparent opacity-40 pointer-events-none'}`}>
                <span className="text-[9px] text-gray-400">River</span>
                <div className="flex gap-0.5">
                  <button onClick={() => setRiverAction('check_call')} className={`px-2 py-1 rounded text-[9px] transition-colors ${riverAction === 'check_call' ? 'bg-[#00E599] text-black font-bold' : 'text-gray-500'}`}>Check</button>
                  <button onClick={() => setRiverAction('raise')} className={`px-2 py-1 rounded text-[9px] transition-colors ${riverAction === 'raise' ? 'bg-[#00E599] text-black font-bold' : 'text-gray-500'}`}>Raise</button>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-4 rounded-xl mb-3 shadow-2xl">
            <div className="mb-3">
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-[#00E599] tracking-wider">WIN</span>
                <span className="text-[#00E599]">{isCalculating ? 'CALCULATING...' : `${equity.win.toFixed(1)}%`}</span>
              </div>
              <div className="h-1.5 w-full bg-[#121212] rounded-full overflow-hidden">
                <div className="h-full bg-[#00E599] transition-all duration-300" style={{ width: `${isCalculating ? 0 : equity.win}%` }} />
              </div>
            </div>
            <div className="mb-3">
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-[#00A3FF] tracking-wider">TIE</span>
                <span className="text-[#00A3FF]">{isCalculating ? '--' : `${equity.tie.toFixed(1)}%`}</span>
              </div>
              <div className="h-1.5 w-full bg-[#121212] rounded-full overflow-hidden">
                <div className="h-full bg-[#00A3FF] transition-all duration-300" style={{ width: `${isCalculating ? 0 : equity.tie}%` }} />
              </div>
            </div>
            <div>
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-[#FF0055] tracking-wider">LOSE</span>
                <span className="text-[#FF0055]">{isCalculating ? '--' : `${equity.lose.toFixed(1)}%`}</span>
              </div>
              <div className="h-1.5 w-full bg-[#121212] rounded-full overflow-hidden">
                <div className="h-full bg-[#FF0055] transition-all duration-300" style={{ width: `${isCalculating ? 0 : equity.lose}%` }} />
              </div>
            </div>
          </div>

          <div className="bg-[#121212]/80 backdrop-blur-md border border-white/10 p-3 rounded-xl mb-4">
            <div className="flex justify-between text-[9px] uppercase tracking-widest text-gray-400 mb-2.5">
              <span>Villain Matrix</span>
              <span className="text-[#00A3FF] font-bold">{isCalculating ? '...' : `${equity.combos} Combos`}</span>
            </div>
            <div className="grid gap-[2px] mx-auto" style={{ gridTemplateColumns: 'repeat(13, minmax(0, 1fr))' }}>
              {RANKS.map((r1, i) => RANKS.map((r2, j) => renderMatrixCell(r1, r2, i, j)))}
            </div>
          </div>

          {pickingSlot && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end">
              <div className="bg-[#141414] border-t border-white/10 p-4 rounded-t-2xl w-full max-w-[410px] mx-auto pb-8">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs uppercase tracking-widest text-gray-300 font-bold">Select Card</span>
                  <button onClick={() => setPickingSlot(null)} className="text-xs text-gray-400 border border-white/10 px-3 py-1 rounded">Close</button>
                </div>
                <div className="grid grid-cols-7 gap-1.5 mb-3">
                  {RANKS.map(r => (
                    <button key={r} onClick={() => setSelectedRank(r)} className={`h-9 rounded font-bold text-xs ${selectedRank === r ? 'bg-[#00E599] text-black shadow-md' : 'bg-white/5 text-white'}`}>{r}</button>
                  ))}
                </div>
                <div className="grid grid-cols-4 gap-2">
                  {SUITS.map(s => {
                    const cardKey = selectedRank + s.id;
                    const isTaken = deadCards.includes(cardKey);
                    return (
                      <button key={s.id} disabled={isTaken} onClick={() => handleAssignCard(cardKey)} className={`h-11 rounded-lg border flex items-center justify-center gap-1.5 text-base font-bold transition-transform ${isTaken ? 'opacity-20 border-transparent bg-white/5 cursor-not-allowed' : 'border-white/10 bg-white/5 active:bg-white/10 active:scale-95'}`}>
                        <span>{selectedRank}</span><span className={s.color}>{s.symbol}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
